# How this repository formats Rust. The import options are nightly-only, so run it as
# `cargo +nightly fmt --all` (or `cargo xtask fmt --fix`, which is what `cargo xtask test` checks).
max_width = 120
use_small_heuristics = "Max"
newline_style = "Unix"
imports_granularity = "Crate"
group_imports = "StdExternalCrate"
unstable_features = true
# Generated code (the def constants from `cargo xtask gen-defs` and the subsystem wrappers from
# `cargo xtask gen-subsystems`) belongs to its generator: formatting it would make the check depend on
# which game build is installed and would disagree with the next generation.
ignore = [
    "examples/*/src/generated_defs/**",
    "mods/*/src/generated_defs/**",
    "crates/rimworld-rs/src/subsystems_extra/**",
]