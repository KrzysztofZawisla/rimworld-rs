# `typos` configuration for this repository.
#
# Every word below is a spelling the **game** uses, not a typo of ours. These names come from
# `Assembly-CSharp.dll`: they sit in the wrappers' `MEMBERS` lists, and `cargo xtask test` verifies each one
# against the real assembly (`674/674 contract requirements`, `0 wrong`) - so "correcting" one would break the
# SDK at runtime while `cargo` stayed happy. The generator's output (`subsystems_extra/`) carries the same
# spellings, which is why they are words here and not `extend-ignore-re` patterns.
[default.extend-words]
Parms = "Parms"
Datas = "Datas"
Tatoo = "Tatoo"
tatoo = "tatoo"
Oppurtunity = "Oppurtunity"
Vaccum = "Vaccum"
Overriden = "Overriden"
Memeber = "Memeber"

# A wrong route is written out rather than left as `mis-route`: the word is fine, but the checker cannot tell
# a prefix from a typo, and a whitelist entry for it would hide the real mistake later.
