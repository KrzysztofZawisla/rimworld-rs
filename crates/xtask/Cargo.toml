[package]
name = "xtask"
description = "Build, install and scaffold tooling for rimworld-rs mods"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# layout parses Rust instead of guessing at it: the rule counts items, so it reads items.
syn = { version = "2", features = ["full"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
# The harness answers with JSON (--members-json), which the generator parses instead of a text layout.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.104"
walkdir = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2", "deflate-flate2-zlib-rs"] }
clap = { version = "4.6.7", features = ["derive"] }
toml_edit = "0.25.17"
heck = "0.5.0"
anstyle = "1.0.14"
anstream = "1.0.0"
which = "4.4.2"
quick-xml = "0.42.0"
cargo_metadata = "0.23.1"

[dev-dependencies]
tempfile = "3.27.0"
